# Pre-commit hooks for code quality and formatting

repos:
  # Black code formatter
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [ --line-length=120, --color ]
        language_version: python3

#  # isort import organizer
#  - repo: https://github.com/PyCQA/isort
#    rev: 5.13.2
#    hooks:
#      - id: isort
#        args: [ --profile=black, --line-length=120 ]

  # flake8 linter
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - --max-line-length=120
          - --extend-ignore=E203,W503,E402
          - src/plotez/
          - tests/

  # pydocstyle for docstring quality
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [ --convention=numpy, --add-ignore=D100,D104,D105,D107 ]
        files: ^src/plotez/.*\.py$
        additional_dependencies: [ tomli ]

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  # pytest – run full test suite before every commit
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true

  # Version sync check – README.md must mention the version from version.py
  - repo: local
    hooks:
      - id: check-version-sync
        name: check version sync (README vs version.py)
        entry: python version_sync.py
        language: system
        pass_filenames: false
        always_run: true

  # uv – upgrade lock file, sync env, and re-export both requirement files
  - repo: local
    hooks:
      - id: uv-export
        name: uv lock --upgrade && uv sync && uv export > requirements[dev].txt && uv export --no-group dev > requirements.txt
        entry: bash -c 'uv lock --upgrade && uv sync && uv export --no-hashes --format requirements-txt > "requirements[dev].txt" && uv export --no-hashes --format requirements-txt --no-group dev > requirements.txt'
        language: system
        pass_filenames: false
        always_run: true
